<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: vibrant grass green -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ACEC44"/>
      <stop offset="100%" stop-color="#3AB810"/>
    </linearGradient>
    <radialGradient id="bgShine" cx="28%" cy="22%" r="52%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Orange gradient for "11" (top-light → bottom-dark) -->
    <linearGradient id="og" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFE84A"/>
      <stop offset="35%"  stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#C03400"/>
    </linearGradient>

    <!-- Blue gradient for "eleven" -->
    <linearGradient id="blg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#80DCFF"/>
      <stop offset="35%"  stop-color="#1878F0"/>
      <stop offset="100%" stop-color="#0032A8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="sh11" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#143800" flood-opacity="0.50"/>
    </filter>
    <filter id="shEl" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6"  flood-color="#143800" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="512" height="512" rx="92" fill="url(#bg)"/>
  <rect width="512" height="512" rx="92" fill="url(#bgShine)"/>

  <!-- ══════════════════════════════════════════
       "11" — rotated −15°, fat bubbly orange
       Thick stroke (28px) + round caps/joins
       creates the rounded balloon shape.
       3D depth: two dark offset layers behind.
       ══════════════════════════════════════════ -->

  <!-- 3D depth layer 2 (deepest shadow) -->
  <text transform="rotate(-15 256 178)"
    x="267" y="265"
    font-family="sans-serif" font-weight="900" font-size="196"
    text-anchor="middle"
    stroke="#6A1400" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"
    paint-order="stroke fill"
    fill="#6A1400" opacity="0.50">11</text>

  <!-- 3D depth layer 1 (mid shadow) -->
  <text transform="rotate(-15 256 178)"
    x="262" y="260"
    font-family="sans-serif" font-weight="900" font-size="196"
    text-anchor="middle"
    stroke="#A82C00" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"
    paint-order="stroke fill"
    fill="#A82C00" opacity="0.70">11</text>

  <!-- Main bubble "11": gradient fill + thick rounded stroke -->
  <text transform="rotate(-15 256 178)"
    x="256" y="254"
    font-family="sans-serif" font-weight="900" font-size="196"
    text-anchor="middle"
    stroke="#CC4000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"
    paint-order="stroke fill"
    fill="url(#og)"
    filter="url(#sh11)">11</text>

  <!-- Highlight gloss (top-left reflection) -->
  <text transform="rotate(-15 256 178)"
    x="248" y="244"
    font-family="sans-serif" font-weight="900" font-size="196"
    text-anchor="middle"
    stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"
    paint-order="stroke fill"
    fill="white" opacity="0.18">11</text>

  <!-- ══════════════════════════════════════════
       "eleven" — horizontal, large, 3D blue
       font-size 106 to maximize width in icon
       ══════════════════════════════════════════ -->

  <!-- 3D depth layer 2 -->
  <text x="266" y="436"
    font-family="sans-serif" font-weight="900" font-size="106"
    text-anchor="middle"
    stroke="#001460" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
    paint-order="stroke fill"
    fill="#001460" opacity="0.50">eleven</text>

  <!-- 3D depth layer 1 -->
  <text x="262" y="432"
    font-family="sans-serif" font-weight="900" font-size="106"
    text-anchor="middle"
    stroke="#003090" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
    paint-order="stroke fill"
    fill="#003090" opacity="0.70">eleven</text>

  <!-- Main bubble "eleven" -->
  <text x="257" y="427"
    font-family="sans-serif" font-weight="900" font-size="106"
    text-anchor="middle"
    stroke="#0048C4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
    paint-order="stroke fill"
    fill="url(#blg)"
    filter="url(#shEl)">eleven</text>

  <!-- Highlight gloss -->
  <text x="252" y="420"
    font-family="sans-serif" font-weight="900" font-size="106"
    text-anchor="middle"
    stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
    paint-order="stroke fill"
    fill="white" opacity="0.18">eleven</text>
</svg>
