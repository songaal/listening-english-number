<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0B0D16"/>
  <!-- Inner card -->
  <rect x="28" y="28" width="456" height="456" rx="80" fill="#13161F"/>
  <!-- Top accent bar -->
  <rect x="100" y="88" width="312" height="5" rx="2.5" fill="#5B9BFF" opacity="0.35"/>
  <!-- Subtle grid lines (educational feel) -->
  <line x1="100" y1="148" x2="412" y2="148" stroke="#5B9BFF" stroke-width="1" opacity="0.06"/>
  <line x1="100" y1="208" x2="412" y2="208" stroke="#5B9BFF" stroke-width="1" opacity="0.06"/>
  <line x1="100" y1="268" x2="412" y2="268" stroke="#5B9BFF" stroke-width="1" opacity="0.06"/>
  <line x1="100" y1="328" x2="412" y2="328" stroke="#5B9BFF" stroke-width="1" opacity="0.06"/>
  <!-- "eleven" — slightly behind, lower opacity -->
  <text
    x="256" y="338"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-weight="700"
    font-size="88"
    fill="#A78BFA"
    text-anchor="middle"
    opacity="0.82"
    letter-spacing="6">eleven</text>
  <!-- "11" — in front, bold accent blue -->
  <text
    x="256" y="310"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-weight="900"
    font-size="232"
    fill="#5B9BFF"
    text-anchor="middle"
    letter-spacing="-6">11</text>
  <!-- Bottom accent bar -->
  <rect x="100" y="408" width="312" height="5" rx="2.5" fill="#A78BFA" opacity="0.35"/>
</svg>
